name: qa-gate
# The PR validation loop: replay the fixture-backed golden cases (downloads +
# dialogs — deterministic, no live-site flake) against the PR's own build and
# post a per-case verdict table as a sticky PR comment. The same comment
# compares each passing case to evals/timings/qa-gate.json and the job fails
# when one takes more than twice its baseline and at least 5s longer, or
# crosses its budget. The full live-site suite stays on the nightly schedule;
# this gate answers "did my change break replay, or make it much slower?"
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  golden-fixtures:
    name: golden fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: build cli
        working-directory: cli
        run: cargo build --locked
      - name: lint committed goldens
        env:
          AGENT_QA_SCENARIOS_DIR: ${{ github.workspace }}/evals/selftest/scenarios
        run: ./cli/target/debug/agent-qa scenario check-all
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: launcher install (resolves agent-browser)
        working-directory: npm/agent-qa
        run: npm install --no-audit --no-fund
      - name: browser install
        working-directory: npm/agent-qa
        env:
          AGENT_BROWSER_HOME: ${{ runner.temp }}/agent-browser-home
        run: ./node_modules/.bin/agent-browser install
      - uses: oven-sh/setup-bun@v2
      - name: replay fixture goldens
        id: gate
        working-directory: evals
        env:
          AGENT_QA_EVAL_AGENT_BROWSER_BIN: ${{ github.workspace }}/npm/agent-qa/node_modules/.bin/agent-browser
          AGENT_BROWSER_BIN: ${{ github.workspace }}/npm/agent-qa/node_modules/.bin/agent-browser
          AGENT_BROWSER_HOME: ${{ runner.temp }}/agent-browser-home
          # Fixture-backed cases only: downloads fixture (13) + dialogs
          # fixture (TC01-06; TC07+ hit the live practice page).
          GOLDEN_ONLY: "golden:file-upload:download,golden:alerts-dialogs:tc01,golden:alerts-dialogs:tc02,golden:alerts-dialogs:tc03,golden:alerts-dialogs:tc04,golden:alerts-dialogs:tc05,golden:alerts-dialogs:tc06"
          # Every replay captures a HAR — the uploaded qa-gate artifact then
          # carries per-run network.har + network.json for debugging.
          AGENT_QA_REPLAY_ARGS: "--har"
        run: bun golden:all
      - name: render run reports
        # One self-contained report.html per replayed run — dropped next to the
        # run's artifacts so the qa-gate upload (and the dedicated reports
        # artifact below) carries it. Failures here must not flip the gate.
        if: always()
        run: |
          for d in evals/results/*/scenarios/*/; do
            AGENT_QA_SCENARIOS_DIR="$(dirname "$d")" \
              cli/target/debug/agent-qa run-report "$(basename "$d")" || true
          done
      - name: upload gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-gate
          path: |
            evals/results/
            evals/scenarios/*/replays/
          retention-days: 30
      - name: upload run reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qa-gate-reports
          path: evals/results/*/scenarios/*/replays/*/report.html
          retention-days: 30
      - name: timing health
        id: timings
        if: always()
        env:
          SAMPLES: ${{ runner.temp }}/timing-samples.json
          REPORT: ${{ runner.temp }}/timings.md
        run: |
          set +e
          bun evals/golden/timing-samples.ts --results-dir evals/results --out "$SAMPLES"
          sample_code=$?
          if [ "$sample_code" = "2" ]; then
            printf '%s\n' '#### Timing — no samples' '' 'The golden rollup was not written, so durations were not compared.' > "$REPORT"
            echo "code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$sample_code" != "0" ]; then
            echo "code=$sample_code" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ./cli/target/debug/agent-qa timings check \
            --samples "$SAMPLES" \
            --baseline "$GITHUB_WORKSPACE/evals/timings/qa-gate.json" \
            --format markdown \
            --out "$REPORT"
          echo "code=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: post sticky verdict comment
        if: always()
        uses: actions/github-script@v9
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TIMINGS_FILE: ${{ runner.temp }}/timings.md
        with:
          script: |
            const { execSync } = require("child_process");
            const timings = process.env.TIMINGS_FILE ? ` --timings-file "${process.env.TIMINGS_FILE}"` : "";
            const body = execSync(
              `bun golden/pr-comment.ts --run-url "${process.env.RUN_URL}"${timings}`,
              { cwd: "evals", encoding: "utf8" },
            );
            const marker = "<!-- qa-gate -->";
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: fail when a case slowed past its baseline
        if: always() && steps.timings.outputs.code != '0' && steps.timings.outputs.code != ''
        run: |
          echo "::error::A fixture case took more than twice its baseline and at least 5s longer, or crossed its 60s budget. The QA gate comment lists it."
          exit 1
