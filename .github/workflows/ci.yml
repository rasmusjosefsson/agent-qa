name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cd cli && cargo build --locked
      - name: test
        working-directory: cli
        run: cargo test --locked
      - name: clippy
        working-directory: cli
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: rustfmt
        working-directory: cli
        run: cargo fmt --check

  smoke-install:
    name: smoke (npm install local)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: build release binary
        working-directory: cli
        run: cargo build --release --locked
      - name: stage platform package
        run: |
          set -eux
          mkdir -p npm/platform/linux-x64/bin
          cp cli/target/release/agent-qa npm/platform/linux-x64/bin/agent-qa-linux-x64
          chmod +x npm/platform/linux-x64/bin/agent-qa-linux-x64
          node scripts/build-platform-pkg.js linux-x64 0.0.0-smoke
          node scripts/build-umbrella-pkg.js 0.0.0-smoke --local-platforms linux-x64
      - name: install + run from local tarballs
        run: |
          set -eux
          cd npm/platform/linux-x64 && npm pack --pack-destination /tmp
          cd $GITHUB_WORKSPACE/npm/agent-qa && npm pack --pack-destination /tmp
          mkdir -p /tmp/install && cd /tmp/install && npm init -y >/dev/null
          npm install /tmp/rasmusjosefsson-agent-qa-linux-x64-*.tgz /tmp/rasmusjosefsson-agent-qa-*.tgz
          ./node_modules/.bin/agent-qa skills list
          ./node_modules/.bin/agent-qa skills get core | head -5
          ./node_modules/.bin/agent-qa scenario validate \
            $GITHUB_WORKSPACE/examples/scenarios/smoke/scenario.json
          ./node_modules/.bin/agent-qa --version
      - name: browser contract
        run: AQ=/tmp/install/node_modules/.bin/agent-qa WORK="$RUNNER_TEMP/agent-qa-browser-contract" BROWSER_HOME="$RUNNER_TEMP/agent-qa-browser-home" scripts/ci-browser-contract.sh
      - name: upload browser contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-qa-browser-contract
          path: ${{ runner.temp }}/agent-qa-browser-contract
          retention-days: 14

  visual-evidence:
    name: visual evidence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: require evidence for web UI changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          scripts/check-pr-visual-evidence.sh
