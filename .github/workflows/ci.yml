name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cd cli && cargo build --locked
      - name: test
        working-directory: cli
        run: cargo test --locked
      - name: clippy
        working-directory: cli
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: rustfmt
        working-directory: cli
        run: cargo fmt --check

  test-linux:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - run: cd cli && cargo build --locked
      - name: test
        working-directory: cli
        run: cargo test --locked
      - name: clippy
        working-directory: cli
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: rustfmt
        working-directory: cli
        run: cargo fmt --check

  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - name: build
        working-directory: cli
        run: cargo build --locked
      - name: test
        working-directory: cli
        run: cargo test --locked

  test-js:
    name: test (launcher + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: launcher install
        working-directory: npm/agent-qa
        run: npm install --no-audit --no-fund
      - name: launcher tests
        working-directory: npm/agent-qa
        run: node --test test/*.test.js
      - name: web install
        working-directory: npm/agent-qa/web
        run: npm ci
      - name: web typecheck
        working-directory: npm/agent-qa/web
        run: npm run typecheck
      - name: web tests
        working-directory: npm/agent-qa/web
        run: npx vitest run

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: cli
        run: cargo audit

  smoke-install:
    name: smoke (npm install local, ${{ matrix.platform }})
    needs: [test, test-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
          - platform: linux-x64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: build release binary
        working-directory: cli
        run: cargo build --release --locked
      - name: stage platform package
        run: |
          set -eux
          PLAT="${{ matrix.platform }}"
          mkdir -p "npm/platform/${PLAT}/bin"
          cp cli/target/release/agent-qa "npm/platform/${PLAT}/bin/agent-qa-${PLAT}"
          chmod +x "npm/platform/${PLAT}/bin/agent-qa-${PLAT}"
          node scripts/build-platform-pkg.js "$PLAT" 0.0.0-smoke
          node scripts/build-umbrella-pkg.js 0.0.0-smoke --local-platforms "$PLAT"
      - name: install + run from local tarballs
        run: |
          set -eux
          cd npm/platform/${{ matrix.platform }} && npm pack --pack-destination /tmp
          cd $GITHUB_WORKSPACE/npm/agent-qa && npm pack --pack-destination /tmp
          mkdir -p /tmp/install && cd /tmp/install && npm init -y >/dev/null
          npm install /tmp/rasmusjosefsson-agent-qa-${{ matrix.platform }}-*.tgz /tmp/rasmusjosefsson-agent-qa-*.tgz
          ./node_modules/.bin/agent-qa skills list
          ./node_modules/.bin/agent-qa skills get core | head -5
          ./node_modules/.bin/agent-qa scenario validate \
            $GITHUB_WORKSPACE/examples/scenarios/smoke/scenario.json
          ./node_modules/.bin/agent-qa --version
      - name: browser contract
        run: AQ=/tmp/install/node_modules/.bin/agent-qa WORK="$RUNNER_TEMP/agent-qa-browser-contract" BROWSER_HOME="$RUNNER_TEMP/agent-qa-browser-home" scripts/ci-browser-contract.sh
      - name: upload browser contract
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-qa-browser-contract-${{ matrix.platform }}
          path: ${{ runner.temp }}/agent-qa-browser-contract
          retention-days: 14

  # Reports the pre-matrix check context that branch protection requires;
  # fails when any smoke leg fails instead of skipping.
  smoke-install-gate:
    name: smoke (npm install local)
    needs: [smoke-install]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.smoke-install.result }}" = "success"
