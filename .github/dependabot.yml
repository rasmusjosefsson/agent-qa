version: 2
updates:
  - package-ecosystem: npm
    directory: /npm/agent-qa
    schedule:
      interval: weekly
    allow:
      - dependency-name: agent-browser
  - package-ecosystem: npm
    directory: /npm/agent-qa/web
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /evals
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /cli
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
