<!doctype html>
<!--
  agent-qa golden diff viewer — standalone, no deps, no build.
  Ships in site/public → deployed to <owner>.github.io/<repo>/diff-viewer.html;
  PR goldens comments link here with the diff image URLs as params.

  Query params:
    b   baseline image URL (required) — or baseline text URL when dom=1
    c   current image URL  (required) — or current text URL when dom=1
    d   diff-map image URL (optional — enables "diff" + "blend" modes)
        or, with dom=1, a unified-diff text URL used when b/c are absent
    dom 1  ARIA snapshot mode: side-by-side / unified line diff of b vs c
    sid scenario id (label only)
    step step id (label only)
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-qa diff viewer</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --fg: #e6edf3;
    --muted: #8b949e; --accent: #58a6ff; --accent-soft: rgba(88,166,255,.18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header .title { font-weight: 600; margin-right: 8px; }
  header .title small { color: var(--muted); font-weight: 400; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button {
    background: transparent; color: var(--muted); border: 0; padding: 4px 10px;
    font: inherit; cursor: pointer; border-right: 1px solid var(--border);
  }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--accent-soft); color: var(--accent); }
  .seg button:hover:not(.on) { color: var(--fg); }
  .zoom { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .zoom button, .zoom select {
    background: var(--panel); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 9px; font: inherit; cursor: pointer;
  }
  .zoom button:hover, .zoom select:hover { border-color: var(--accent); }
  .zoom .pct { min-width: 48px; text-align: center; color: var(--muted); }
  label.mix { display: none; align-items: center; gap: 6px; color: var(--muted); }
  label.mix.show { display: flex; }
  label.mix input { accent-color: var(--accent); }

  main { flex: 1; position: relative; overflow: hidden; }
  img { -webkit-user-drag: none; user-select: none; }
  #stage {
    position: absolute; inset: 0; overflow: hidden; cursor: grab;
    touch-action: none;
    background:
      linear-gradient(45deg, #1c2128 25%, transparent 25%, transparent 75%, #1c2128 75%),
      linear-gradient(45deg, #1c2128 25%, transparent 25%, transparent 75%, #1c2128 75%);
    background-size: 24px 24px; background-position: 0 0, 12px 12px;
    background-color: #11161d;
  }
  #stage.zoomed { cursor: move; }
  #pan { position: absolute; transform-origin: 0 0; }
  .layer { position: absolute; inset: 0; }
  .layer img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: top left; }
  #after-clip { overflow: hidden; }
  #divider {
    position: absolute; top: 0; bottom: 0; width: 2px; background: #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.5); display: none; pointer-events: none;
  }
  #divider .knob {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 26px; height: 26px; border-radius: 50%; background: #fff; color: #333;
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
    box-shadow: 0 1px 4px rgba(0,0,0,.5);
  }
  #pair { position: absolute; inset: 0; display: none; gap: 8px; padding: 8px; }
  #pair figure { margin: 0; flex: 1; position: relative; overflow: hidden; border: 1px solid var(--border); border-radius: 6px; }
  #pair img { width: 100%; height: 100%; object-fit: contain; object-position: top; }
  #pair figcaption {
    position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.6);
    color: #fff; padding: 2px 7px; border-radius: 4px; font-size: 11px;
  }
  .tag {
    position: absolute; top: 8px; background: rgba(0,0,0,.6); color: #fff;
    padding: 2px 7px; border-radius: 4px; font-size: 11px; z-index: 5; pointer-events: none;
  }
  .tag.l { left: 8px; } .tag.r { right: 8px; }
  @keyframes blinkfade { 0%,49% {opacity:0} 50%,100% {opacity:1} }
  #stage.blink #after-clip img { animation: blinkfade 1.1s steps(1,end) infinite; }
  @media (prefers-reduced-motion: reduce) {
    #stage.blink #after-clip img { animation: none; opacity: 1; }
  }
  #err {
    position: absolute; inset: 0; display: none; place-items: center;
    color: var(--muted); text-align: center; padding: 20px;
  }
  #domview { display: none; flex: 1; min-height: 0; flex-direction: column; }
  #domview.on { display: flex; }
  .dombar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
  }
  #domstat { margin-left: auto; color: var(--muted); }
  #changedOnly.on { background: var(--accent-soft); color: var(--accent); }
  #dombody { flex: 1; overflow: auto; font-size: 12px; }
  .dhead, .drow {
    display: grid; grid-template-columns: 3rem 1fr 3rem 1fr;
  }
  .dhead {
    position: sticky; top: 0; background: var(--panel); color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; font-size: 10px;
    border-bottom: 1px solid var(--border);
  }
  .dhead span, .dcell { padding: 2px 8px; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .drow { border-bottom: 1px solid rgba(48,54,61,.6); }
  .dcell.no { text-align: right; color: var(--muted); user-select: none; }
  .dcell.del { background: rgba(248,81,73,.12); color: #ffa198; }
  .dcell.add { background: rgba(63,185,80,.12); color: #7ee787; }
  .dcell.eq { color: var(--muted); }
  .dcell mark { background: rgba(255,255,255,.14); color: inherit; border-radius: 2px; padding: 0 2px; }
  .gap { text-align: center; color: var(--muted); padding: 2px; }
  #dombody.unified .dhead { display: none; }
  #dombody.unified .drow { display: block; }
  #dombody.unified .dcell.no, #dombody.unified .dcell.empty, #dombody.unified .dcell.dup { display: none; }
  #dombody.unified .dcell.del::before { content: "-"; }
  #dombody.unified .dcell.add::before { content: "+"; }
  #dombody.unified .dcell.eq::before { content: " "; }
  footer { padding: 4px 12px; color: var(--muted); background: var(--panel); border-top: 1px solid var(--border); font-size: 11px; }
  kbd { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<header>
  <span class="title" id="title">diff viewer</span>
  <div class="seg" id="modes" role="tablist" aria-label="view mode">
    <button data-m="wipe" class="on">wipe</button>
    <button data-m="blink">blink</button>
    <button data-m="side">side-by-side</button>
    <button data-m="diff">diff map</button>
    <button data-m="blend">blend</button>
  </div>
  <label class="mix" id="mixwrap">diff opacity <input id="mix" type="range" min="0" max="1" step="0.05" value="0.6"></label>
  <div class="zoom">
    <button id="zin" title="zoom in (+)">+</button>
    <span class="pct" id="pct">fit</span>
    <button id="zout" title="zoom out (−)">−</button>
    <button id="zfit" title="fit to window (0)">fit</button>
    <button id="z100" title="actual pixels (1)">1:1</button>
  </div>
</header>
<main>
  <div id="stage" tabindex="0" aria-label="image compare area">
    <div id="pan">
      <div class="layer" id="l-before"><img id="imgB" alt="baseline"></div>
      <div class="layer" id="after-clip"><img id="imgA" alt="current"></div>
      <div class="layer" id="l-diff" style="display:none;mix-blend-mode:normal"><img id="imgD" alt="diff map"></div>
      <div id="divider"><div class="knob">⇔</div></div>
      <span class="tag l" id="tagB">baseline</span>
      <span class="tag r" id="tagA">current</span>
    </div>
    <div id="pair">
      <figure><figcaption id="capB">baseline</figcaption><img id="pB" alt="baseline"></figure>
      <figure><figcaption id="capA">current</figcaption><img id="pA" alt="current"></figure>
      <figure id="pairD" style="flex:1"><figcaption>diff map</figcaption><img id="pD" alt="diff map"></figure>
    </div>
  </div>
  <div id="err"></div>
  <div id="domview" hidden>
    <div class="dombar">
      <div class="seg" id="dommodes" role="tablist" aria-label="text diff layout">
        <button data-m="side" class="on" type="button">side-by-side</button>
        <button data-m="unified" type="button">unified</button>
      </div>
      <button id="changedOnly" type="button">changed only</button>
      <span id="domstat"></span>
    </div>
    <div id="dombody"></div>
  </div>
</main>
<footer>
  drag: move wipe / pan when zoomed · wheel: zoom · <kbd>+</kbd>/<kbd>−</kbd>/<kbd>0</kbd>/<kbd>1</kbd> zoom · <kbd>←</kbd>/<kbd>→</kbd> wipe · <kbd>[</kbd>/<kbd>]</kbd> modes
</footer>
<script>
// Raw-HTML wrappers (htmlpreview.github.io) nest this page's URL inside
// their own query — the inner `?` then marks where OUR params start.
const raw = location.search;
const inner = raw.indexOf('?', 1);
const q = new URLSearchParams(inner > 0 ? raw.slice(inner) : raw);
const DOM_MODE = q.get('dom') === '1';
const B = q.get('b'), C = q.get('c'), D = q.get('d');
// Structural (domshot) mode — same line pairing as web/src/lib/line-diff.ts.
function bootDom(baseUrl, curUrl, diffUrl) {
  document.getElementById('modes').style.display = 'none';
  document.querySelector('.zoom').style.display = 'none';
  document.getElementById('stage').style.display = 'none';
  const view = document.getElementById('domview');
  view.hidden = false;
  view.classList.add('on');
  document.querySelector('footer').textContent = '[ / ] layout · changed only hides equal lines';
  const body = document.getElementById('dombody');
  const stat = document.getElementById('domstat');
  const showErr = (msg) => {
    document.getElementById('err').style.display = 'grid';
    document.getElementById('err').textContent = msg;
    view.style.display = 'none';
  };
  const splitLines = (text) => {
    const stripped = text.endsWith('\n') ? text.slice(0, -1) : text;
    return stripped === '' ? [] : stripped.split('\n');
  };
  const lcsOps = (a, b) => {
    const n = a.length, m = b.length;
    const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) {
      for (let j = m - 1; j >= 0; j--) {
        dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    const ops = [];
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { ops.push({ t: 'eq', text: a[i] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: 'del', text: a[i] }); i++; }
      else { ops.push({ t: 'add', text: b[j] }); j++; }
    }
    while (i < n) ops.push({ t: 'del', text: a[i++] });
    while (j < m) ops.push({ t: 'add', text: b[j++] });
    return ops;
  };
  const tokenize = (s) => s.split(/(\s+)/).filter((t) => t.length > 0);
  const tokenSpans = (a, b) => {
    const ta = tokenize(a), tb = tokenize(b);
    if (ta.length * tb.length > 20000) {
      return { before: [{ text: a, changed: a !== b }], after: [{ text: b, changed: a !== b }] };
    }
    const ops = lcsOps(ta, tb);
    const before = [], after = [];
    const push = (spans, text, changed) => {
      const prev = spans[spans.length - 1];
      if (prev && prev.changed === changed) prev.text += text;
      else spans.push({ text, changed });
    };
    let i = 0;
    while (i < ops.length) {
      if (ops[i].t === 'eq') { push(before, ops[i].text, false); push(after, ops[i].text, false); i++; continue; }
      while (i < ops.length && ops[i].t === 'del') { push(before, ops[i].text, true); i++; }
      while (i < ops.length && ops[i].t === 'add') { push(after, ops[i].text, true); i++; }
    }
    return { before, after };
  };
  const lineDiff = (beforeText, afterText) => {
    const a = splitLines(beforeText), b = splitLines(afterText);
    const ops = a.length * b.length > 800000
      ? a.map((line, i) => (i < b.length ? (line === b[i] ? [{ t: 'eq', text: line }] : [{ t: 'del', text: line }, { t: 'add', text: b[i] }]) : [{ t: 'del', text: line }])).flat()
          .concat(b.slice(a.length).map((line) => ({ t: 'add', text: line })))
      : lcsOps(a, b);
    const rows = [];
    let i = 0;
    while (i < ops.length) {
      if (ops[i].t === 'eq') { rows.push({ kind: 'same', before: ops[i].text, after: ops[i].text }); i++; continue; }
      const dels = [], adds = [];
      while (i < ops.length && ops[i].t !== 'eq') {
        if (ops[i].t === 'del') dels.push(ops[i].text); else adds.push(ops[i].text);
        i++;
      }
      const n = Math.max(dels.length, adds.length);
      for (let k = 0; k < n; k++) {
        if (dels[k] !== undefined && adds[k] !== undefined) {
          const spans = tokenSpans(dels[k], adds[k]);
          rows.push({ kind: 'change', before: dels[k], after: adds[k], beforeSpans: spans.before, afterSpans: spans.after });
        } else if (dels[k] !== undefined) rows.push({ kind: 'del', before: dels[k] });
        else rows.push({ kind: 'add', after: adds[k] });
      }
    }
    return rows;
  };
  const fill = (el, spans, fallback) => {
    el.textContent = '';
    if (!spans) { el.textContent = fallback || ''; return; }
    for (const s of spans) {
      if (!s.changed) el.appendChild(document.createTextNode(s.text));
      else {
        const m = document.createElement('mark');
        m.textContent = s.text;
        el.appendChild(m);
      }
    }
  };
  let rows = [];
  let layout = 'side';
  let changedOnly = false;
  const render = () => {
    body.classList.toggle('unified', layout === 'unified');
    body.textContent = '';
    if (rows.length === 0 || rows.every((r) => r.kind === 'same')) {
      const p = document.createElement('p');
      p.className = 'gap';
      p.textContent = rows.length === 0 ? 'Both snapshots are empty.' : 'The two snapshots are identical.';
      body.appendChild(p);
      return;
    }
    const head = document.createElement('div');
    head.className = 'dhead';
    for (const label of ['', 'baseline', '', 'current']) {
      const s = document.createElement('span');
      s.textContent = label;
      head.appendChild(s);
    }
    body.appendChild(head);
    let bNo = 0, aNo = 0, skipped = false, shown = 0;
    for (const row of rows) {
      const bn = row.before !== undefined ? ++bNo : null;
      const an = row.after !== undefined ? ++aNo : null;
      if (changedOnly && row.kind === 'same') { skipped = true; continue; }
      if (skipped) {
        const g = document.createElement('div');
        g.className = 'gap';
        g.textContent = '···';
        body.appendChild(g);
        skipped = false;
      }
      shown++;
      const line = document.createElement('div');
      line.className = 'drow';
      const cells = [
        { cls: 'no', text: bn == null ? '' : String(bn) },
        { cls: row.kind === 'add' ? 'empty' : row.kind === 'same' ? 'eq' : 'del', spans: row.beforeSpans, text: row.before },
        { cls: 'no', text: an == null ? '' : String(an) },
        { cls: row.kind === 'del' ? 'empty' : row.kind === 'same' ? 'eq dup' : 'add', spans: row.afterSpans, text: row.after },
      ];
      for (const c of cells) {
        const el = document.createElement('div');
        el.className = 'dcell ' + c.cls;
        if (c.spans) fill(el, c.spans, c.text);
        else el.textContent = c.text || '';
        line.appendChild(el);
      }
      body.appendChild(line);
    }
    if (shown === 0) {
      const p = document.createElement('p');
      p.className = 'gap';
      p.textContent = rows.length === 0 ? 'Both snapshots are empty.' : 'The two snapshots are identical.';
      body.appendChild(p);
    }
  };
  document.getElementById('dommodes').addEventListener('click', (e) => {
    const m = e.target.dataset && e.target.dataset.m;
    if (!m) return;
    layout = m;
    for (const b of document.querySelectorAll('#dommodes button')) b.classList.toggle('on', b.dataset.m === m);
    render();
  });
  document.getElementById('changedOnly').addEventListener('click', (e) => {
    changedOnly = !changedOnly;
    e.currentTarget.classList.toggle('on', changedOnly);
    render();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== '[' && e.key !== ']') return;
    layout = layout === 'side' ? 'unified' : 'side';
    for (const b of document.querySelectorAll('#dommodes button')) b.classList.toggle('on', b.dataset.m === layout);
    render();
  });
  const loadPair = async () => {
    const [rb, rc] = await Promise.all([fetch(baseUrl), fetch(curUrl)]);
    if (!rb.ok || !rc.ok) throw new Error('could not load baseline and current snapshots');
    rows = lineDiff(await rb.text(), await rc.text());
    const changed = rows.filter((r) => r.kind !== 'same').length;
    stat.textContent = changed === 0 ? 'snapshots match' : changed + ' changed line' + (changed === 1 ? '' : 's');
    render();
  };
  const loadUnified = async () => {
    const r = await fetch(diffUrl);
    if (!r.ok) throw new Error('could not load the unified diff');
    layout = 'unified';
    document.querySelector('#dommodes [data-m="side"]').style.display = 'none';
    document.querySelector('#dommodes [data-m="unified"]').classList.add('on');
    document.getElementById('changedOnly').style.display = 'none';
    body.classList.add('unified');
    body.textContent = '';
    const pre = document.createElement('pre');
    pre.style.margin = '0';
    pre.style.padding = '12px';
    pre.style.whiteSpace = 'pre-wrap';
    pre.textContent = await r.text();
    body.appendChild(pre);
    stat.textContent = 'unified diff';
  };
  const job = baseUrl && curUrl ? loadPair() : diffUrl ? loadUnified() : Promise.reject(new Error('missing ?b=<baseline>&c=<current> snapshot URLs (or ?d=<unified diff>)'));
  job.catch((e) => showErr(e && e.message ? e.message : String(e)));
}
if (DOM_MODE) {
  bootDom(B, C, D);
} else {
const sid = q.get('sid'), step = q.get('step');
if (sid || step) {
  document.getElementById('title').innerHTML =
    'diff viewer <small>' + [sid, step].filter(Boolean).map(encodeURIComponent).join(' · ') + '</small>';
  document.title = `agent-qa diff · ${[sid, step].filter(Boolean).join('/')}`;
}
const stage = document.getElementById('stage'), pan = document.getElementById('pan');
const afterClip = document.getElementById('after-clip'), divider = document.getElementById('divider');
const lDiff = document.getElementById('l-diff'), pair = document.getElementById('pair');
const tagB = document.getElementById('tagB'), tagA = document.getElementById('tagA');
const mixwrap = document.getElementById('mixwrap'), mix = document.getElementById('mix');
const errBox = document.getElementById('err');

const imgB = document.getElementById('imgB'), imgA = document.getElementById('imgA'),
  imgD = document.getElementById('imgD'), pB = document.getElementById('pB'),
  pA = document.getElementById('pA'), pD = document.getElementById('pD'),
  pairD = document.getElementById('pairD'), lBefore = document.getElementById('l-before');

if (!B || !C) {
  errBox.style.display = 'grid';
  errBox.textContent = 'missing ?b=<baseline>&c=<current> image URLs';
  stage.style.display = 'none';
} else {
  imgB.src = B; pB.src = B;
  imgA.src = C; pA.src = C;
  if (D) { imgD.src = D; pD.src = D; } else {
    pairD.style.display = 'none';
    document.querySelector('[data-m="diff"]').style.display = 'none';
    document.querySelector('[data-m="blend"]').style.display = 'none';
  }
}

// ---- zoom / pan ----
let scale = 0, tx = 0, ty = 0; // scale 0 = fit
const fitScale = () => {
  const iw = imgB.naturalWidth || stage.clientWidth, ih = imgB.naturalHeight || stage.clientHeight;
  return Math.min(stage.clientWidth / iw, stage.clientHeight / ih, 1);
};
function apply() {
  if (scale === 0) {
    pan.style.transform = ''; pan.style.width = '100%'; pan.style.height = '100%';
    stage.classList.remove('zoomed');
    document.getElementById('pct').textContent = 'fit';
    return;
  }
  const iw = imgB.naturalWidth || 1, ih = imgB.naturalHeight || 1;
  pan.style.width = iw + 'px'; pan.style.height = ih + 'px';
  pan.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  stage.classList.add('zoomed');
  document.getElementById('pct').textContent = Math.round(scale * 100) + '%';
}
function zoomAt(f, cx, cy) {
  const base = scale === 0 ? fitScale() : scale;
  const ns = Math.min(8, Math.max(0.05, base * f));
  const r = stage.getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  // keep the point under the cursor fixed
  const ox = scale === 0 ? (r.width - (imgB.naturalWidth || r.width) * base) / 2 : tx;
  const oy = scale === 0 ? (r.height - (imgB.naturalHeight || r.height) * base) / 2 : ty;
  tx = px - ((px - ox) / base) * ns;
  ty = py - ((py - oy) / base) * ns;
  scale = ns;
  apply();
}
imgB.addEventListener('load', apply);
stage.addEventListener('wheel', (e) => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.25 : 0.8, e.clientX, e.clientY); }, { passive: false });
document.getElementById('zin').onclick = () => zoomAt(1.25, ...center());
document.getElementById('zout').onclick = () => zoomAt(0.8, ...center());
document.getElementById('zfit').onclick = () => { scale = 0; apply(); };
document.getElementById('z100').onclick = () => { scale = 0; apply(); zoomAt(1 / fitScale(), ...center()); };
const center = () => { const r = stage.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };

// ---- wipe / pan drag ----
let pos = 0.5, dragging = false, panDrag = false, lastX = 0, lastY = 0;
function setWipePos(p) {
  pos = Math.min(1, Math.max(0, p));
  const px = pos * 100;
  afterClip.style.clipPath = `inset(0 0 0 ${px}%)`;
  divider.style.left = `${px}%`;
}
function setWipeAt(clientX) {
  const r = stage.getBoundingClientRect();
  setWipePos((clientX - r.left) / r.width);
}
// Native image drag steals pointermove until drop — block it.
for (const img of document.querySelectorAll('img')) img.draggable = false;
stage.addEventListener('dragstart', (e) => e.preventDefault());
stage.addEventListener('pointerdown', (e) => {
  e.preventDefault(); // also suppresses native image drag in Firefox
  stage.focus(); // preventDefault blocks focus; keep arrow-key wipe working
  stage.setPointerCapture(e.pointerId);
  dragging = true; panDrag = scale !== 0;
  lastX = e.clientX; lastY = e.clientY;
  if (!panDrag && mode === 'wipe') setWipeAt(e.clientX);
});
stage.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  if (panDrag) { tx += e.clientX - lastX; ty += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; apply(); }
  else if (mode === 'wipe') setWipeAt(e.clientX);
});
stage.addEventListener('pointerup', () => { dragging = false; panDrag = false; });
stage.addEventListener('pointercancel', () => { dragging = false; panDrag = false; });

// ---- modes ----
let mode = 'wipe';
const modes = document.getElementById('modes');
function setMode(m) {
  mode = m;
  for (const b of modes.querySelectorAll('button')) b.classList.toggle('on', b.dataset.m === m);
  pan.style.display = m === 'side' ? 'none' : '';
  pair.style.display = m === 'side' ? 'flex' : 'none';
  divider.style.display = m === 'wipe' ? 'block' : 'none';
  stage.classList.toggle('blink', m === 'blink');
  lDiff.style.display = m === 'diff' || m === 'blend' ? '' : 'none';
  lDiff.style.opacity = m === 'blend' ? mix.value : 1;
  // wipe = clip the after layer at the divider; everything else = full frame
  afterClip.style.clipPath = m === 'wipe' ? `inset(0 0 0 ${pos * 100}%)` : 'inset(0)';
  lBefore.style.display = m === 'diff' ? 'none' : '';
  tagA.style.display = m === 'diff' ? 'none' : '';
  tagB.style.display = m === 'diff' || m === 'blend' ? 'none' : '';
  mixwrap.classList.toggle('show', m === 'blend');
}
modes.addEventListener('click', (e) => { if (e.target.dataset.m) setMode(e.target.dataset.m); });
mix.addEventListener('input', () => { if (mode === 'blend') lDiff.style.opacity = mix.value; });

// ---- keys ----
const MODE_ORDER = ['wipe', 'blink', 'side', 'diff', 'blend'];
stage.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'ArrowRight') { setWipePos(pos + (k === 'ArrowRight' ? 0.05 : -0.05)); e.preventDefault(); }
  else if (k === '+' || k === '=') zoomAt(1.25, ...center());
  else if (k === '-' || k === '_') zoomAt(0.8, ...center());
  else if (k === '0') { scale = 0; apply(); }
  else if (k === '1') { scale = 0; apply(); zoomAt(1 / fitScale(), ...center()); }
  else if (k === '[' || k === ']') {
    const avail = MODE_ORDER.filter((m) => document.querySelector(`[data-m="${m}"]`).style.display !== 'none');
    const i = avail.indexOf(mode);
    setMode(avail[(i + (k === ']' ? 1 : avail.length - 1)) % avail.length]);
  }
  else if (k === 'Escape') { scale = 0; apply(); setMode('wipe'); }
});
setMode('wipe');
setWipePos(0.5); // init
}
</script>
</body>
</html>
