name: agent-qa
description: >-
  Replay agent-qa scenarios on a PR: installs the CLI (from the published
  npm package, or built from source), installs the browser, runs
  `replay --all` over a scenarios dir, renders per-run HTML reports,
  and uploads the whole evidence tree as an artifact.
branding:
  icon: check-circle
  color: green

inputs:
  scenarios:
    description: Directory of scenario dirs to replay (passed as AGENT_QA_SCENARIOS_DIR).
    default: scenarios
  args:
    description: >-
      Extra args appended to `agent-qa replay --all` — e.g.
      "--shard 1/3 --tags smoke --retry 2 --junit".
    default: ""
  version:
    description: >-
      Published agent-qa version to install from npm (e.g. "0.1.0").
      Empty builds the CLI from this action's source checkout — the right
      mode for this repo's own workflows and for trying unreleased main.
    default: ""
  server:
    description: >-
      Command to launch the app under test in the background before replay
      (e.g. "npm run dev -- --port 5173"). Stdout/stderr go to a temp log
      shown on wait failure. Leave empty when scenarios goto a public URL.
    default: ""
  wait-url:
    description: >-
      URL polled until it answers <500 before replay starts (e.g.
      "http://localhost:5173"). Pairs with `server`, or waits on a
      separately-started preview.
    default: ""
  wait-timeout:
    description: Seconds to wait for wait-url.
    default: "60"
  comment:
    description: >-
      Post/update a sticky <!-- agent-qa --> verdict comment on the
      triggering pull_request (per-scenario verdict + duration). Needs
      the calling job to grant `pull-requests: write`. No-op outside PRs.
    default: "true"
  reports:
    description: Render <run>/report.html per scenario (requires a cli build containing run-report).
    default: "true"
  artifact-name:
    description: Name of the uploaded evidence artifact.
    default: agent-qa-evidence
  retention-days:
    description: Artifact retention in days.
    default: "30"

runs:
  using: composite
  steps:
    - name: install agent-qa from npm
      if: inputs.version != ''
      shell: bash
      run: npm install --global "agent-qa@${{ inputs.version }}"
    - uses: dtolnay/rust-toolchain@stable
      if: inputs.version == ''
    - uses: Swatinem/rust-cache@v2
      if: inputs.version == ''
      with:
        workspaces: ${{ github.action_path }}/cli
    - name: build cli
      if: inputs.version == ''
      shell: bash
      working-directory: ${{ github.action_path }}/cli
      run: cargo build --locked
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: launcher install (resolves agent-browser)
      if: inputs.version == ''
      shell: bash
      working-directory: ${{ github.action_path }}/npm/agent-qa
      run: npm install --no-audit --no-fund
    - name: locate binaries
      id: bin
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -eu
        if [ -n "$VERSION" ]; then
          echo "qa=agent-qa" >> "$GITHUB_OUTPUT"
          echo "browser=$(npm root -g)/agent-qa/node_modules/.bin/agent-browser" >> "$GITHUB_OUTPUT"
        else
          echo "qa=${{ github.action_path }}/cli/target/debug/agent-qa" >> "$GITHUB_OUTPUT"
          echo "browser=${{ github.action_path }}/npm/agent-qa/node_modules/.bin/agent-browser" >> "$GITHUB_OUTPUT"
        fi
    - name: browser install
      shell: bash
      env:
        AGENT_BROWSER_HOME: ${{ runner.temp }}/agent-browser-home
      run: "${{ steps.bin.outputs.browser }} install"
    - name: start app server
      if: inputs.server != ''
      shell: bash
      env:
        SERVER_CMD: ${{ inputs.server }}
      run: |
        nohup bash -c "$SERVER_CMD" > "$RUNNER_TEMP/agent-qa-server.log" 2>&1 &
        disown
    - name: wait for app
      if: inputs['wait-url'] != ''
      shell: bash
      env:
        WAIT_URL: ${{ inputs['wait-url'] }}
        WAIT_TIMEOUT: ${{ inputs['wait-timeout'] }}
      run: |
        for i in $(seq 1 "$WAIT_TIMEOUT"); do
          code="$(curl -s -o /dev/null -w '%{http_code}' "$WAIT_URL" || true)"
          if [ "${code:-0}" -gt 0 ] && [ "${code:-0}" -lt 500 ]; then
            echo "$WAIT_URL ready after ${i}s (HTTP $code)"
            exit 0
          fi
          sleep 1
        done
        echo "::error::$WAIT_URL never answered within ${WAIT_TIMEOUT}s"
        if [ -f "$RUNNER_TEMP/agent-qa-server.log" ]; then
          echo "::group::server log"
          tail -100 "$RUNNER_TEMP/agent-qa-server.log"
          echo "::endgroup::"
        fi
        exit 1
    - name: replay suite
      shell: bash
      env:
        AGENT_BROWSER_BIN: ${{ steps.bin.outputs.browser }}
        AGENT_BROWSER_HOME: ${{ runner.temp }}/agent-browser-home
        AGENT_QA_SCENARIOS_DIR: ${{ github.workspace }}/${{ inputs.scenarios }}
      run: |
        "${{ steps.bin.outputs.qa }}" replay --all ${{ inputs.args }}
    - name: render run reports
      if: inputs.reports == 'true'
      shell: bash
      continue-on-error: true
      env:
        AGENT_BROWSER_BIN: ${{ steps.bin.outputs.browser }}
        AGENT_QA_SCENARIOS_DIR: ${{ github.workspace }}/${{ inputs.scenarios }}
      run: |
        BIN="${{ steps.bin.outputs.qa }}"
        for d in "$AGENT_QA_SCENARIOS_DIR"/*/replays/latest.txt; do
          [ -f "$d" ] || continue
          sid="$(basename "$(dirname "$(dirname "$d")")")"
          "$BIN" run-report "$sid" || echo "::warning::run-report failed for $sid"
        done
    - name: PR verdict comment
      if: >-
        always() && inputs.comment == 'true' &&
        github.event_name == 'pull_request'
      shell: bash
      env:
        AGENT_QA_SCENARIOS_DIR: ${{ github.workspace }}/${{ inputs.scenarios }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -u
        BIN="${{ steps.bin.outputs.qa }}"
        {
          echo '<!-- agent-qa -->'
          echo '### agent-qa verdict'
          echo
          echo '| scenario | verdict | duration |'
          echo '| --- | --- | --- |'
          for sid_dir in "$AGENT_QA_SCENARIOS_DIR"/*/; do
            sid="$(basename "$sid_dir")"
            v="$("$BIN" audit verdict "$sid" latest 2>/dev/null | tail -1 | awk '{print $1}' || true)"
            d="$("$BIN" audit duration "$sid" latest 2>/dev/null | tail -1 | awk '{print $1}' || true)"
            echo "| $sid | ${v:-no run} | ${d:--} |"
          done
          echo
          echo "Evidence: artifact \`${{ inputs.artifact-name }}\` (replays + report.html per scenario)."
        } > "$RUNNER_TEMP/agent-qa-comment.md"
        REPO="${{ github.repository }}"
        PR="${{ github.event.pull_request.number }}"
        existing="$(gh api "repos/$REPO/issues/$PR/comments" \
          --jq '[.[] | select(.body | contains("<!-- agent-qa -->"))][-1].id // empty' || true)"
        if [ -n "$existing" ]; then
          gh api "repos/$REPO/issues/comments/$existing" -X PATCH \
            -f body="$(cat "$RUNNER_TEMP/agent-qa-comment.md")" >/dev/null
        else
          gh api "repos/$REPO/issues/$PR/comments" \
            -f body="$(cat "$RUNNER_TEMP/agent-qa-comment.md")" >/dev/null
        fi
    - name: upload evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ github.workspace }}/${{ inputs.scenarios }}/*/replays/
        retention-days: ${{ inputs.retention-days }}
